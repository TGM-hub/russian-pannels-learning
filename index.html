<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyrillic Reader</title>
<style>
:root{
  --bg:#f4f2ed;--panel:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#dedad2;
  --accent:#1a6b8a;--ok:#1e7a3c;--okbg:#e2f3e7;--bad:#b3261e;--badbg:#fbe4e2;--mid:#9a6700;--midbg:#fff1cc;
  --sea:#dfe9f0;--land:#e7e4dc;--reg:#f8f4e8;--regline:#c3bba8;--hover:#f1ddb0;--hit:#f4c27a;--miss:#f2a8a2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17181a;--panel:#222326;--ink:#ececec;--muted:#9a9aa0;--line:#35363a;
  --accent:#6cc0e0;--ok:#6fd08f;--okbg:#1f3a28;--bad:#ff8a80;--badbg:#4a2322;--mid:#f2c14e;--midbg:#43381a;
  --sea:#1b2630;--land:#2a2b2e;--reg:#34342f;--regline:#56544b;--hover:#5b4d2c;--hit:#a8732a;--miss:#8a3a34;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0 8px 0 0;font-weight:650}
.chips{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:9px}
.chips button{border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:7px;cursor:pointer;font:inherit}
.chips button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0002}
.stats{margin-left:auto;display:flex;gap:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#10202a}}
.btn:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:1fr} svg#map{height:65vh;min-height:320px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.sign{background:#fff;border:6px solid #111;outline:3px solid #fff;box-shadow:0 0 0 4px #111,0 6px 18px #0003;border-radius:6px;
  color:#111;text-align:center;padding:18px 10px;margin:10px 6px 20px;font:700 clamp(26px,6vw,40px)/1.15 "Arial Narrow",Arial,sans-serif;letter-spacing:.5px;word-break:break-word}
.step{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 8px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
.verdict{margin-top:14px;padding:10px 12px;border-radius:8px;display:none}
.verdict.ok{background:var(--okbg);color:var(--ok);display:block}
.verdict.mid{background:var(--midbg);color:var(--mid);display:block}
.verdict.bad{background:var(--badbg);color:var(--bad);display:block}
.verdict .lat{font-size:22px;font-weight:650;color:var(--ink)}
.letters{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.lt{min-width:30px;text-align:center;border-radius:6px;padding:3px 4px;background:var(--bg);border:1px solid var(--line)}
.lt .c{font-size:20px;font-weight:600}
.lt .t{font-size:13px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);min-height:17px}
.lt.ok{border-color:transparent;background:var(--okbg)}
.lt.bad{border-color:var(--bad);background:var(--badbg)}
.lt.bad .t s{color:var(--bad)}
.lt.bad .t i{font-style:normal;color:var(--ok);font-weight:600}
.lt.gap{background:none;border:0;min-width:10px}
.audio{margin-left:6px}
.result{margin-top:14px;display:none}
.result.on{display:block}
.result .big{font-size:20px;font-weight:650}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.mapwrap{position:relative;padding:0;overflow:hidden;min-height:420px;display:flex;flex-direction:column}
.maphead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.maphead .step{margin:0}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom .btn{padding:4px 10px}
svg#map{width:100%;height:calc(100vh - 150px);min-height:420px;background:var(--sea);touch-action:none;cursor:grab;display:block}
svg#map.active{cursor:crosshair}
svg#map .bg{fill:var(--land);stroke:var(--bg);stroke-width:1}
svg#map .reg{fill:var(--reg);stroke:var(--regline);stroke-width:.8;vector-effect:non-scaling-stroke}
svg#map .bord{fill:none;stroke:var(--muted);stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:none}
svg#map.active .reg:hover{fill:var(--hover)}
svg#map .reg.hit{fill:var(--hit)}
svg#map .reg.miss{fill:var(--miss)}
svg#map .bg,svg#map .bord{vector-effect:non-scaling-stroke}
.locked{position:absolute;inset:48px 0 0 0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:var(--muted)}
.locked span{background:var(--panel);padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
aside#cheat{position:fixed;right:0;top:0;bottom:0;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .2s;z-index:10;overflow:auto;padding:16px;box-shadow:-8px 0 24px #0002}
aside#cheat.on{transform:none}
aside h2{font-size:16px;margin:0 0 10px}
aside h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px}
.gl{border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center}
.gl b{display:block;font-size:20px}
.gl span{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.gl.faux{border-color:var(--bad)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}
.foot{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>Cyrillic Reader</h1>
  <div class="chips" id="filter">
    <button data-f="RUS" class="on">Russie</button>
    <button data-f="OTHER">Autres pays</button>
    <button data-f="ALL">Tout</button>
  </div>
  <button class="btn" id="cheatBtn">Alphabet</button>
  <div class="stats">
    <span>Manches <b id="sRounds">0</b></span>
    <span>Lecture <b id="sRead">–</b></span>
    <span>Carte <b id="sMap">–</b></span>
    <span>Série <b id="sStreak">0</b></span>
  </div>
</header>

<main>
  <section class="card">
    <div class="step">1 · Lis le panneau</div>
    <div class="sign" id="sign">…</div>
    <div class="row">
      <input type="text" id="guess" placeholder="Écris le nom en latin…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn primary" id="submit">Valider</button>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="letters" id="letters"></div>
    <div class="result" id="result"></div>
    <div class="foot"><kbd>Entrée</kbd> valider / manche suivante · <kbd>Ctrl</kbd>+<kbd>Espace</kbd> réécouter · molette ou boutons pour zoomer, glisser pour déplacer</div>
  </section>

  <section class="card mapwrap">
    <div class="maphead">
      <div class="step" id="mapStep">2 · Place la ville (clique sur la région)</div>
      <div class="zoom">
        <button class="btn" id="zin" title="Zoomer">+</button>
        <button class="btn" id="zout" title="Dézoomer">−</button>
        <button class="btn" id="zfit" title="Vue d'ensemble">⤢</button>
      </div>
    </div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="gBg"></g><g id="gReg"></g><g id="gBord"></g><g id="gMark"></g>
    </svg>
    <div class="locked" id="locked"><span>Lis d'abord le panneau</span></div>
  </section>
</main>

<aside id="cheat">
  <div class="row" style="align-items:center"><h2 style="flex:1;margin:0">Alphabet</h2><button class="btn" id="cheatClose">✕</button></div>
  <div id="cheatBody"></div>
</aside>

 'о':['o','a'],'п':['p'],'р':['r'],'с':['s','c'],'т':['t'],'у':['u','ou','oo','y'],'ф':['f','ph'],'х':['kh','h','x','ch'],
 'ц':['ts','c','tz','z','tc'],'ч':['ch','c','tch','tsch','cz'],'ш':['sh','s','ch','sch'],'щ':['shch','sch','sh','shh','sht','sc','st'],
 'ъ':['','a','u','y'],'ы':['y','i'],'ь':['','y','i'],'э':['e'],'ю':['yu','iu','ju','u'],'я':['ya','ia','ja','a'],
 'і':['i','y'],'ї':['yi','i','ji'],'є':['ye','ie','je','e'],'ґ':['g'],'ў':['u','w','v'],
 'ђ':['dj','d','gj','dz'],'ћ':['c','ch','tj','cj'],'џ':['dz','dzh','j','dj'],'ј':['j','y','i'],'љ':['lj','l','ly'],'њ':['nj','n','ny'],
 'ѓ':['gj','dj','g','d'],'ќ':['kj','c','ch','k','tj'],'ѕ':['dz','z'],
 'ә':['a','ae','e'],'ғ':['g','gh'],'қ':['q','k'],'ң':['n','ng'],'ө':['o','oe','u','yo'],'ұ':['u'],'ү':['u','ue','y','yu'],'һ':['h']
};
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/đ/g,'dj').replace(/ł/g,'l').replace(/ß/g,'ss').replace(/[^a-z]/g,'');
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++)
  c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c;} return p[n]; }

// Aligne la saisie sur les lettres cyrilliques : coût minimal + découpage par lettre
function align(cyr, input){
  const letters=[...cyr.toLowerCase()].filter(ch=>OPT[ch]);
  const opts=letters.map((ch,i)=>{ const o=[...OPT[ch]]; if(i>0 && letters[i-1]===ch && !o.includes('')) o.push(''); return o; });
  const s=norm(input), n=letters.length, m=s.length, INF=1e9;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(INF)), bk=Array.from({length:n+1},()=>new Array(m+1));
  for(let j=0;j<=m;j++) dp[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=0;j<=m;j++){
    for(const o of opts[i-1]){ for(let k=Math.max(0,j-o.length-2);k<=j;k++){
      if(dp[i-1][k]>=INF) continue; const c=dp[i-1][k]+lev(o,s.slice(k,j));
      if(c<dp[i][j]){dp[i][j]=c; bk[i][j]=[k,o];} } }
  }
  // saisie en trop au début : dp[0][j]=j ; en trop à la fin : déjà couvert par les k<j
  let best=dp[n][m];
  const segs=[]; let j=m;
  for(let i=n;i>=1;i--){ const [k,o]=bk[i][j]; segs.unshift({ch:letters[i-1], typed:s.slice(k,j), ok:OPT[letters[i-1]].includes(s.slice(k,j))||(o===''&&s.slice(k,j)===''), exp:OPT[letters[i-1]][0]}); j=k; }
  if(j>0 && segs.length){ segs[0].typed=s.slice(0,j)+segs[0].typed; segs[0].ok=false; }
  return {cost:best, segs, len:n};
}
function judge(city, input){
  const s=norm(input); if(!s) return null;
  const a=align(city.n, input);
  const exact=city.alt.some(x=>norm(x)===s);
  if(exact) a.segs.forEach(g=>g.ok=true);
  const cost=exact?0:a.cost;
  const tol=a.len>10?2:1;
  const level=cost===0?'ok':cost<=tol?'mid':'bad';
  return {level, cost, segs:a.segs};
}

// ---------- Carte ----------
const svg=document.getElementById('map'), NS='http://www.w3.org/2000/svg';
const regEls={};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); parent&&parent.appendChild(e); return e;}
DATA.bg.forEach(d=>el('path',{d,class:'bg'},gBg));
DATA.regions.forEach(r=>{ const p=el('path',{d:r.d,class:'reg','data-id':r.id,'data-c':r.c},gReg); regEls[r.id]=p; });
DATA.borders.forEach(d=>el('path',{d,class:'bord'},gBord));
const regById=Object.fromEntries(DATA.regions.map(r=>[r.id,r]));

let vb={x:0,y:0,w:1,h:1};
function setVB(v){vb=v; svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`); updateMarkers();}
function bboxOf(filter){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  DATA.regions.forEach(r=>{ if(!inFilter(r.c,filter)) return; const b=regEls[r.id].getBBox();
    x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.width);y1=Math.max(y1,b.y+b.height);});
  return {x0,y0,x1,y1};
}
function fitBox(x0,y0,x1,y1,pad=0.06){
  const r=svg.getBoundingClientRect(), ar=r.width/Math.max(r.height,1);
  let w=(x1-x0)*(1+2*pad), h=(y1-y0)*(1+2*pad), cx=(x0+x1)/2, cy=(y0+y1)/2;
  if(w/h>ar) h=w/ar; else w=h*ar;
  setVB({x:cx-w/2,y:cy-h/2,w,h});
}
function fitFilter(){ const b=bboxOf(filter); fitBox(b.x0,b.y0,b.x1,b.y1); }
function zoomAt(f,cx,cy){ if(cx===undefined){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  const w=Math.min(Math.max(vb.w*f,150),12000), k=w/vb.w; setVB({x:cx-(cx-vb.x)*k,y:cy-(cy-vb.y)*k,w,h:vb.h*k}); }
function toSvg(evt){ const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const p=toSvg(e); zoomAt(e.deltaY>0?1.2:1/1.2,p.x,p.y);},{passive:false});
let drag=null, moved=false; const pointers=new Map(); let pinch=null;
svg.addEventListener('pointerdown',e=>{ pointers.set(e.pointerId,e);
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}; drag=null; }
  else { drag={x:e.clientX,y:e.clientY,vb:{...vb}}; moved=false; } });
svg.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,e);
  if(pinch && pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    const mid=toSvg({clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2}); zoomAt(pinch.d/d,mid.x,mid.y); pinch.d=d; moved=true; return; }
  if(!drag) return; const r=svg.getBoundingClientRect(), s=vb.w/r.width, dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!moved && Math.abs(dx)+Math.abs(dy)>4){ moved=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} }
  if(moved) setVB({...drag.vb,x:drag.vb.x-dx*s,y:drag.vb.y-dy*s}); });
const endPtr=e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinch=null; if(!pointers.size) setTimeout(()=>drag=null,0); };
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
zin.onclick=()=>zoomAt(1/1.5); zout.onclick=()=>zoomAt(1.5); zfit.onclick=fitFilter;

let markers=[];
function updateMarkers(){ const r=vb.w/(svg.getBoundingClientRect().width||800);
  markers.forEach(m=>{ if(m.type==='dot'){m.e.setAttribute('r',m.px*r); m.e.setAttribute('stroke-width',2*r);} else m.e.setAttribute('stroke-width',m.px*r); }); }
function clearMarks(){ gMark.innerHTML=''; markers=[]; document.querySelectorAll('.reg.hit,.reg.miss').forEach(e=>e.classList.remove('hit','miss')); }

const A_E=6378.137, E_E=0.0818191908;
function unproj(x,y){ // Mercator ellipsoïdal inverse (WGS84)
  const t=Math.exp(y/A_E); let phi=Math.PI/2-2*Math.atan(t);
  for(let i=0;i<5;i++){ const es=E_E*Math.sin(phi); phi=Math.PI/2-2*Math.atan(t*Math.pow((1-es)/(1+es),E_E/2)); }
  return [phi*180/Math.PI, x/A_E*180/Math.PI+80]; }
function hav([a,b],[c,d]){ const r=Math.PI/180, s=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2; return 2*6371*Math.asin(Math.sqrt(s)); }
// ---------- Jeu ----------
let filter='RUS', city=null, phase='read', queue=[], readRes=null;
const st={rounds:0,read:0,map:0,streak:0};
const inFilter=(c,f)=>f==='ALL'||(f==='RUS'?c==='RUS':c!=='RUS');
function nextCity(){
  if(!queue.length){ queue=DATA.cities.filter(c=>inFilter(c.c,filter)); for(let i=queue.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[queue[i],queue[j]]=[queue[j],queue[i]];} }
  city=queue.pop(); phase='read'; readRes=null;
  sign.textContent=city.n; guess.value=''; guess.disabled=false; submit.disabled=false; submit.textContent='Valider';
  verdict.className='verdict'; verdict.innerHTML=''; letters.innerHTML=''; result.className='result'; result.innerHTML='';
  locked.style.display='flex'; svg.classList.remove('active'); clearMarks(); fitFilter(); guess.focus();
}
let audio=null;
function play(){ if(!city) return; audio&&audio.pause(); audio=new Audio('audio/'+city.a); audio.play().catch(()=>{}); }
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function doRead(){
  const r=judge(city,guess.value); if(!r){guess.focus();return;}
  readRes=r; phase='map'; guess.disabled=true; submit.disabled=true;
  const msg={ok:'✓ Parfait',mid:'≈ Presque',bad:'✗ Pas tout à fait'}[r.level];
  verdict.className='verdict '+r.level;
  verdict.innerHTML=`${msg} <button class="btn audio" onclick="play()" title="Réécouter">🔊</button><div class="lat">${esc(city.l)}</div>`;
  // lettre par lettre
  const segs=[...r.segs]; let html='';
  for(const ch of city.n){ const low=ch.toLowerCase();
    if(!OPT[low]){ html+='<div class="lt gap"></div>'; continue; }
    const s=segs.shift(); if(!s) continue;
    const t=s.ok?esc(s.typed||'·'):`${s.typed?'<s>'+esc(s.typed)+'</s> ':''}<i>${esc(s.exp||'∅')}</i>`;
    html+=`<div class="lt ${s.ok?'ok':'bad'}" title="${esc(OPT[low].filter(Boolean).join(' / ')||'muet')}"><div class="c">${esc(ch)}</div><div class="t">${t}</div></div>`; }
  letters.innerHTML=html;
  play(); locked.style.display='none'; svg.classList.add('active');
  if(window.innerWidth<=860) document.querySelector('.mapwrap').scrollIntoView({behavior:'smooth',block:'start'});
}
function doMap(evt, regId){
  phase='done'; svg.classList.remove('active');
  const p=toSvg(evt), d=hav(unproj(p.x,p.y),[city.lat,city.lon]), good=regId===city.r||d<30;
  const score=good?100:Math.round(80*Math.exp(-d/450));
  regEls[city.r].classList.add('hit'); if(!good && regId!=null && regEls[regId]) regEls[regId].classList.add('miss');
  const line=el('line',{x1:p.x,y1:p.y,x2:city.x,y2:city.y,stroke:'#c0392b','stroke-dasharray':'6 4'},gMark); markers.push({e:line,type:'line',px:2});
  const g=el('circle',{cx:p.x,cy:p.y,fill:'#555',stroke:'#fff'},gMark); markers.push({e:g,type:'dot',px:5});
  const c=el('circle',{cx:city.x,cy:city.y,fill:'#c0392b',stroke:'#fff'},gMark); markers.push({e:c,type:'dot',px:7});
  const x0=Math.min(p.x,city.x),x1=Math.max(p.x,city.x),y0=Math.min(p.y,city.y),y1=Math.max(p.y,city.y), m=Math.max(300-(x1-x0)/2,300-(y1-y0)/2,80);
  fitBox(x0-m,y0-m,x1+m,y1+m,0.05);
  const R=regById[city.r], C=regById[regId];
  // stats
  const rs={ok:100,mid:60,bad:0}[readRes.level];
  st.rounds++; st.read+=rs; st.map+=score; st.streak=(readRes.level!=='bad'&&good)?st.streak+1:0;
  sRounds.textContent=st.rounds; sRead.textContent=Math.round(st.read/st.rounds)+'%'; sMap.textContent=Math.round(st.map/st.rounds)+'%'; sStreak.textContent=st.streak;
  const hint=city.c!=='RUS'?`<div class="hint">🔎 ${esc(DATA.hints[city.c])}</div>`:'';
  result.className='result on';
  result.innerHTML=`<div class="big">${good?'✓ Bonne région':'✗ '+Math.round(d)+' km'} · ${score} pts</div>
    <div>${esc(DATA.countries[city.c])} — <b>${esc(R.ru)}</b> <span class="hint">(${esc(R.en)})</span></div>
    ${!good?`<div class="hint">Tu as cliqué : ${C?esc(C.ru)+' ('+esc(DATA.countries[C.c])+')':'hors des pays cyrilliques'}</div>`:''}${hint}
    <div style="margin-top:10px"><button class="btn primary" id="nextBtn">Suivant →</button></div>`;
  nextBtn.onclick=()=>{nextCity(); window.scrollTo({top:0,behavior:'smooth'});}; nextBtn.focus({preventScroll:true});
}
svg.addEventListener('click',e=>{ if(phase!=='map'||moved) return;
  const t=document.elementFromPoint(e.clientX,e.clientY); const id=t&&t.getAttribute&&t.getAttribute('data-id');
  doMap(e, id==null?null:+id); });
submit.onclick=doRead;
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ if(phase==='read'&&document.activeElement===guess) doRead(); else if(phase==='done') { e.preventDefault(); nextCity(); } }
  if(e.code==='Space'&&e.ctrlKey){ e.preventDefault(); play(); }
  if(e.key==='Escape') cheat.classList.remove('on');
});
const filterEl=document.getElementById('filter');
filterEl.onclick=e=>{ const f=e.target.dataset.f; if(!f) return; filter=f; queue=[];
  filterEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===f)); nextCity(); };

// ---------- Antisèche ----------
const RU=[['А','a'],['Б','b'],['В','v',1],['Г','g'],['Д','d'],['Е','ye/e'],['Ё','yo'],['Ж','zh'],['З','z'],['И','i'],['Й','y'],['К','k'],['Л','l'],['М','m'],['Н','n',1],['О','o'],['П','p'],['Р','r',1],['С','s',1],['Т','t'],['У','u',1],['Ф','f'],['Х','kh',1],['Ц','ts'],['Ч','ch'],['Ш','sh'],['Щ','shch'],['Ъ','(dur)'],['Ы','y'],['Ь','(mou)'],['Э','e'],['Ю','yu'],['Я','ya']];
const EXTRA=[['Ukraine',[['І','i'],['Ї','yi'],['Є','ye'],['Ґ','g'],['И','y'],['Г','h']]],
 ['Biélorussie',[['Ў','w/u'],['І','i'],['Г','h']]],
 ['Bulgarie',[['Ъ','ă (eu)'],['Щ','sht']]],
 ['Serbie · Monténégro · Bosnie',[['Ђ','đ'],['Ћ','ć'],['Џ','dž'],['Ј','j'],['Љ','lj'],['Њ','nj']]],
 ['Macédoine du Nord',[['Ѓ','gj'],['Ќ','kj'],['Ѕ','dz'],['Ј','j'],['Љ','lj'],['Њ','nj'],['Џ','dž']]],
 ['Kazakhstan',[['Ә','ä'],['Ғ','gh'],['Қ','q'],['Ң','ng'],['Ө','ö'],['Ұ','u'],['Ү','ü'],['Һ','h'],['І','i']]],
 ['Kirghizistan · Mongolie',[['Ң','ng'],['Ө','ö'],['Ү','ü']]]];
const cell=([c,l,f])=>`<div class="gl${f?' faux':''}"><b>${c}</b><span>${l}</span></div>`;
cheatBody.innerHTML=`<h3>Russe <span style="text-transform:none;letter-spacing:0">(bord rouge = faux ami)</span></h3><div class="grid">${RU.map(cell).join('')}</div>`
 + EXTRA.map(([t,ls])=>`<h3>${t}</h3><div class="grid">${ls.map(cell).join('')}</div>`).join('');
cheatBtn.onclick=()=>cheat.classList.toggle('on'); cheatClose.onclick=()=>cheat.classList.remove('on');

window.addEventListener('resize',()=>{ if(phase!=='done') fitFilter(); else updateMarkers(); });
nextCity();
</script>
